version: "3.8"

services:
  frontend:
    image: rida999/mock-frontend:latest
    container_name: ai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    environment:
      - NODE_ENV=production

  backend:
    image: rida999/mock-backend:latest
    container_name: ai-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: backend
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mockerdb_prod
      SPRING_DATASOURCE_USERNAME: mockerdb_owner
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: mockerdb_prod
      POSTGRES_USER: mockerdb_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

volumes:
  pgdata:
