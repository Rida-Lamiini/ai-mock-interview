# -----------------------------------------------------
# GitLab CI/CD Pipeline - Full Stack (Backend + Frontend)
# -----------------------------------------------------

default:
  retry: 2
  interruptible: true

stages:
  - lint
  - test
  - build
  - docker
  - deploy

# -----------------------------------------------------
# Backend Linting
# -----------------------------------------------------
backend_lint:
  stage: lint
  image: maven:3.9.9-eclipse-temurin-21
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
    policy: pull-push
  before_script:
    - cd backend
    - export MAVEN_OPTS="-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  script:
    - ./mvnw checkstyle:check
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: true

# -----------------------------------------------------
# Frontend Linting
# -----------------------------------------------------
frontend_lint:
  stage: lint
  image: node:18-alpine
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
    policy: pull-push
  before_script:
    - cd frontend
    - npm ci
  script:
    - npx eslint src/ --max-warnings=0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: true

# -----------------------------------------------------
# Backend Tests
# -----------------------------------------------------
backend_test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
    policy: pull-push
  before_script:
    - cd backend
    - export MAVEN_OPTS="-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  script:
    - ./mvnw test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/*.xml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# -----------------------------------------------------
# Frontend Tests
# -----------------------------------------------------
frontend_test:
  stage: test
  image: node:18-alpine
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
    policy: pull-push
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run test
  artifacts:
    when: always
    reports:
      junit:
        - frontend/test-results/*.xml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# -----------------------------------------------------
# Backend Build
# -----------------------------------------------------
backend_build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
    policy: pull-push
  before_script:
    - cd backend
    - chmod +x ./mvnw
    - export MAVEN_OPTS="-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  script:
    - ./mvnw clean package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour
  dependencies:
    - backend_test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# -----------------------------------------------------
# Frontend Build
# -----------------------------------------------------
frontend_build:
  stage: build
  image: node:18-alpine
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
    policy: pull-push
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  dependencies:
    - frontend_test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# -----------------------------------------------------
# Docker Build (Backend & Frontend in Parallel)
# -----------------------------------------------------
docker_build:
  stage: docker
  image: docker:24.0.6
  services:
    - docker:24.0.6-dind
  variables:
    DOCKER_DRIVER: overlay2
  parallel:
    matrix:
      - NAME: backend
        PATH: ./backend
      - NAME: frontend
        PATH: ./frontend
  before_script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
  script:
    - export COMMIT_SHA=${CI_COMMIT_SHA:0:8}
    - docker build -t rida999/mock-$NAME:latest -t rida999/mock-$NAME:$COMMIT_SHA $PATH
    - docker push rida999/mock-$NAME:latest
    - docker push rida999/mock-$NAME:$COMMIT_SHA
    - docker run --rm aquasec/trivy image rida999/mock-$NAME:$COMMIT_SHA || echo "Scan skipped"
  dependencies:
    - backend_build
    - frontend_build
  after_script:
    - docker system prune -f
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# -----------------------------------------------------
# Deployment (Manual Trigger)
# -----------------------------------------------------
deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - echo "Deploying to staging server..."
  script:
    - ssh user@staging-server "
      docker pull rida999/mock-backend:$CI_COMMIT_SHA &&
      docker pull rida999/mock-frontend:$CI_COMMIT_SHA &&
      docker-compose -f /path/to/docker-compose.yml up -d
      "
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
