# -------------------------------
# GitLab CI/CD Pipeline for Full-Stack Project
# -------------------------------

stages:
  - lint # Optional: catch style/code issues early
  - test # Run unit tests
  - build # Build backend/frontend artifacts
  - docker # Build & push Docker images
  - deploy # Optional: staging/prod deployments

# --------------------------------
# Backend Linting
# --------------------------------
backend_lint:
  stage: lint
  image: maven:3.9.9-eclipse-temurin-21
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.m2/repository
    policy: pull-push
    restore-keys:
      - maven-
  before_script:
    - cd backend
  script:
    - ./mvnw checkstyle:check # You can add SpotBugs, PMD here too
  only:
    - main
  allow_failure: true # Pipeline continues if lint fails

# --------------------------------
# Backend Tests
# --------------------------------
backend_test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.m2/repository
    policy: pull-push
  before_script:
    - cd backend
  script:
    - ./mvnw test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/*.xml # GitLab can show test results
  only:
    - main
  allow_failure: false # Pipeline stops if tests fail

# --------------------------------
# Frontend Linting
# --------------------------------
frontend_lint:
  stage: lint
  image: node:18-alpine
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
    policy: pull-push
  before_script:
    - cd frontend
    - npm ci
  script:
    - npx eslint src/ --max-warnings=0 # Fails on any lint warning
  only:
    - main
  allow_failure: true

# --------------------------------
# Frontend Tests
# (Optional, can add Jest/React Testing Library)
# --------------------------------
frontend_test:
  stage: test
  image: node:18-alpine
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
    policy: pull-push
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run test -- --watchAll=false
  artifacts:
    when: always
    reports:
      junit:
        - frontend/test-results/*.xml
  only:
    - main
  allow_failure: false

# --------------------------------
# Backend Build
# --------------------------------
backend_build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.m2/repository
    policy: pull-push
  before_script:
    - cd backend
    - chmod +x ./mvnw
  script:
    - ./mvnw clean package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour
  dependencies:
    - backend_test
  only:
    - main

# --------------------------------
# Frontend Build
# --------------------------------
frontend_build:
  stage: build
  image: node:18-alpine
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
    policy: pull-push
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  only:
    - main

# --------------------------------
# Docker Build and Push Backend
# --------------------------------
docker_backend:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    # Use both latest tag and commit SHA for traceability
    - export COMMIT_SHA=${CI_COMMIT_SHA:0:8}
    - docker build -t rida999/mock-backend:latest -t rida999/mock-backend:$COMMIT_SHA ./backend
    - docker push rida999/mock-backend:latest
    - docker push rida999/mock-backend:$COMMIT_SHA
    # Optional: scan image for vulnerabilities
    - docker run --rm aquasec/trivy image rida999/mock-backend:$COMMIT_SHA
  dependencies:
    - backend_build
  only:
    - main
  after_script:
    - docker system prune -f

# --------------------------------
# Docker Build and Push Frontend
# --------------------------------
docker_frontend:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    - export COMMIT_SHA=${CI_COMMIT_SHA:0:8}
    - docker build -t rida999/mock-frontend:latest -t rida999/mock-frontend:$COMMIT_SHA ./frontend
    - docker push rida999/mock-frontend:latest
    - docker push rida999/mock-frontend:$COMMIT_SHA
    - docker run --rm aquasec/trivy image rida999/mock-frontend:$COMMIT_SHA
  dependencies:
    - frontend_build
  only:
    - main
  after_script:
    - docker system prune -f

# --------------------------------
# Optional Deployment Stage
# --------------------------------
deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - echo "Deploying to staging server..."
  script:
    - ssh user@staging-server "docker pull rida999/mock-backend:$COMMIT_SHA && docker pull rida999/mock-frontend:$COMMIT_SHA && docker-compose up -d"
  only:
    - main
  when: manual # Manual trigger for safety
