stages:
  - build
  - docker

# Backend Build Job
backend_build:
  stage: build
  image: maven:3.8.6-openjdk-17
  before_script:
    - cd backend
    - chmod +x ./mvnw
  script:
    - ./mvnw clean package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour
  only:
    - main

# Frontend Build Job
frontend_build:
  stage: build
  image: node:18-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  only:
    - main

# Docker Build and Push Backend
docker_backend:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    - docker build -t rida999/mock-backend:latest ./backend
    - docker push rida999/mock-backend:latest
  dependencies:
    - backend_build
  only:
    - main

# Docker Build and Push Frontend
docker_frontend:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    - docker build -t rida999/mock-frontend:latest ./frontend
    - docker push rida999/mock-frontend:latest
  dependencies:
    - frontend_build
  only:
    - main
