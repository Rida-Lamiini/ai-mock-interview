name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend-changed: ${{ steps.filter.outputs.frontend }}
      backend-changed: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git diff

      - name: Get changed files
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - '.github/workflows/**'

  frontend-checks:
    needs: determine-changes
    if: needs.determine-changes.outputs.frontend-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run affected tests
        working-directory: ./frontend
        run: |
          # Install git-changes (lightweight alternative to Nx)
          npm install -g git-changes

          # Get changed files and run only relevant tests
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD -- frontend)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Running tests for changed files:"
            echo "$CHANGED_FILES"
            npm test -- --findRelatedTests $CHANGED_FILES
          else
            echo "No frontend files changed, skipping tests"
          fi

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  backend-checks:
    needs: determine-changes
    if: needs.determine-changes.outputs.backend-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"

      - name: Detect changed Java files
        id: changed-files
        working-directory: ./backend
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD -- backend/src)
          echo "changed_files=${CHANGED_FILES}" >> $GITHUB_OUTPUT

      - name: Run affected tests
        working-directory: ./backend
        run: |
          if [ -n "${{ steps.changed-files.outputs.changed-files }}" ]; then
            echo "Running tests for changed files:"
            echo "${{ steps.changed-files.outputs.changed-files }}"
            mvn test -pl $(echo "${{ steps.changed-files.outputs.changed-files }}" | \
              grep -o 'src/main/java/.*\.java' | \
              sed 's/src\/main\/java\///; s/\.java//; s/\//./g' | \
              sort | uniq | paste -sd "," -)
          else
            echo "No backend source files changed, skipping tests"
          fi

      - name: Build backend
        working-directory: ./backend
        run: mvn package -DskipTests
