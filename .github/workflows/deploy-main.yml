name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/ai-mock-intervie
  BUILD_DATE: ${{ github.run_number }}
  GIT_SHA: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Get full git history for proper version tagging

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}-frontend
            ${{ env.DOCKER_HUB_REPO }}-backend
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      # Frontend Build & Push
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v3
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKER_HUB_REPO }}-frontend:latest
            ${{ env.DOCKER_HUB_REPO }}-frontend:${{ env.GIT_SHA }}
            ${{ env.DOCKER_HUB_REPO }}-frontend:${{ env.BUILD_DATE }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      # Backend Build & Push
      - name: Build and push backend image
        uses: docker/build-push-action@v3
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_HUB_REPO }}-backend:latest
            ${{ env.DOCKER_HUB_REPO }}-backend:${{ env.GIT_SHA }}
            ${{ env.DOCKER_HUB_REPO }}-backend:${{ env.BUILD_DATE }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      # Update cache
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Database Migrations
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: "temurin"

      - name: Run database migrations
        working-directory: ./backend
        run: |
          # Use a dedicated migration image for production safety
          docker run --rm \
            -e FLYWAY_URL=${{ secrets.PROD_DB_URL }} \
            -e FLYWAY_USER=${{ secrets.PROD_DB_USER }} \
            -e FLYWAY_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} \
            ${{ env.DOCKER_HUB_REPO }}-backend:${{ env.GIT_SHA }} \
            ./mvnw flyway:migrate

      # Notifications
      - name: Notify on success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Deployment successful! Images pushed to Docker Hub.'
            })
